<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing In - Lumen</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/lumen-logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0b1218,#132131);color:#eef3f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(520px,calc(100% - 32px));padding:34px 30px;border-radius:22px;
  background:#101a25;border:1px solid rgba(126,157,194,.18);box-shadow:0 20px 60px rgba(0,0,0,.28)}
h1{margin:0 0 10px;font-size:28px}
p{margin:0;color:#9fb1c5;line-height:1.7}
#status{margin-top:18px;color:#d7e4f2}
#retry{display:none;margin-top:18px;padding:11px 16px;border:0;border-radius:10px;
  background:#d7e4f2;color:#132131;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div class="lumen-brand" style="margin-bottom:18px">
      <img class="lumen-brand-logo compact" src="{{ url_for('static', filename='images/lumen-logo.png') }}" alt="Lumen logo">
    </div>
    <h1>Completing sign-in</h1>
    <p>Lumen is verifying your Google session and preparing your dashboard.</p>
    <p id="status">Checking Supabase session…</p>
    <button id="retry" type="button">Return to sign in</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = {{ supabase_url|tojson }};
    const supabaseAnonKey = {{ supabase_anon_key|tojson }};
    const nextUrl = new URL(window.location.href).searchParams.get('next') || '/app';
    const statusEl = document.getElementById('status');
    const retryButton = document.getElementById('retry');
    const isDesktopApp = {{ is_desktop_app|tojson }};

    const fail = (message) => {
      statusEl.textContent = message;
      if (isDesktopApp) {
        retryButton.style.display = 'inline-block';
      } else {
        setTimeout(() => window.location.href = `/?next=${encodeURIComponent(nextUrl)}`, 1800);
      }
    };
    retryButton.addEventListener('click', () => {
      window.location.href = `/desktop?next=${encodeURIComponent(nextUrl)}`;
    });

    if (!supabaseUrl || !supabaseAnonKey) {
      fail('Supabase configuration is missing.');
    } else {
      // The callback exchanges the OAuth code explicitly below. Disabling
      // automatic URL detection prevents Supabase from racing that exchange
      // and consuming the one-time code before this page can finish sign-in.
      const supabase = createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          detectSessionInUrl: false,
          persistSession: true,
          autoRefreshToken: true,
        },
      });
      const callbackUrl = new URL(window.location.href);
      const code = callbackUrl.searchParams.get('code');
      const fragment = new URLSearchParams(callbackUrl.hash.slice(1));
      const fragmentAccessToken = fragment.get('access_token');
      const fragmentRefreshToken = fragment.get('refresh_token');

      try {
        if (code) {
          statusEl.textContent = 'Exchanging Google code for a Supabase session…';
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else if (fragmentAccessToken && fragmentRefreshToken) {
          statusEl.textContent = 'Restoring your Google session…';
          const { error } = await supabase.auth.setSession({
            access_token: fragmentAccessToken,
            refresh_token: fragmentRefreshToken,
          });
          if (error) throw error;
        }

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        const accessToken = data.session?.access_token;
        if (!accessToken) {
          throw new Error('Sign-in returned without a session. Please try again.');
        }

        statusEl.textContent = 'Creating secure server session…';
        const resp = await fetch('/auth/session', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({access_token: accessToken, next: nextUrl}),
        });
        const payload = await resp.json();
        if (!resp.ok || !payload.ok) throw new Error(payload.error || 'Could not create session.');
        window.location.href = payload.redirect_to || '/app';
      } catch (error) {
        fail(error.message || 'Authentication failed.');
      }
    }
  </script>
</body>
</html>
