<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing In - VisualAssistCam</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0b1218,#132131);color:#eef3f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(520px,calc(100% - 32px));padding:34px 30px;border-radius:22px;
  background:#101a25;border:1px solid rgba(126,157,194,.18);box-shadow:0 20px 60px rgba(0,0,0,.28)}
h1{margin:0 0 10px;font-size:28px}
p{margin:0;color:#9fb1c5;line-height:1.7}
#status{margin-top:18px;color:#d7e4f2}
</style>
</head>
<body>
  <div class="card">
    <h1>Completing sign-in</h1>
    <p>VisualAssistCam is verifying your Google session and preparing your dashboard.</p>
    <p id="status">Checking Supabase session…</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = {{ supabase_url|tojson }};
    const supabaseAnonKey = {{ supabase_anon_key|tojson }};
    const nextUrl = new URL(window.location.href).searchParams.get('next') || '/app';
    const statusEl = document.getElementById('status');

    const fail = (message) => {
      statusEl.textContent = message;
      setTimeout(() => window.location.href = `/?next=${encodeURIComponent(nextUrl)}`, 1800);
    };

    if (!supabaseUrl || !supabaseAnonKey) {
      fail('Supabase configuration is missing.');
    } else {
      const supabase = createClient(supabaseUrl, supabaseAnonKey);
      const code = new URL(window.location.href).searchParams.get('code');

      try {
        if (code) {
          statusEl.textContent = 'Exchanging Google code for a Supabase session…';
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        }

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        const accessToken = data.session?.access_token;
        if (!accessToken) throw new Error('No Supabase access token found.');

        statusEl.textContent = 'Creating secure server session…';
        const resp = await fetch('/auth/session', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({access_token: accessToken, next: nextUrl}),
        });
        const payload = await resp.json();
        if (!resp.ok || !payload.ok) throw new Error(payload.error || 'Could not create session.');
        window.location.href = payload.redirect_to || '/app';
      } catch (error) {
        fail(error.message || 'Authentication failed.');
      }
    }
  </script>
</body>
</html>
